# Local development stack: Rails app, PostgreSQL with pgvector, MinIO.
#   docker compose up                        # everything
#   docker compose up -d postgres minio-init # just the services, run Rails natively
# Values come from .env (copied from .env.example by bin/setup).
name: towertrace

x-s3-env: &s3-env
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-towertrace}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-towertrace-dev-secret}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-towertrace-evidence}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-towertrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-towertrace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # MinIO stopped publishing official images in 2025; pgsty/minio is a
  # community build of the same server. See docs/decisions.md.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-towertrace}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-towertrace-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # One-shot: waits for MinIO, then creates the evidence bucket with
  # versioning on, so a deleted or replaced object keeps its prior versions.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    environment:
      <<: *s3-env
    entrypoint: ["sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing --with-versioning "local/$$S3_BUCKET"

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"]
    environment:
      <<: *s3-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-towertrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-towertrace}
      S3_ENDPOINT: http://minio:9000
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-minio}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/rails
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
